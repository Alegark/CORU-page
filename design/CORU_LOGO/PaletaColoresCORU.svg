<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="80" y="70" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#666666" text-anchor="start" letter-spacing="4">02 / COLOR</text>
<text x="80" y="125" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#000000" text-anchor="start" letter-spacing="0">Paleta CORU</text>
<text x="1520" y="82" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#666666" text-anchor="end" letter-spacing="0">Blanco como base, negro para estructura</text>
<text x="1520" y="112" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#666666" text-anchor="end" letter-spacing="0">y mint como señal de marca.</text>
<rect x="80" y="220" width="270" height="420" rx="28" fill="#39F79B"/>
<text x="104" y="585" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#000000" text-anchor="start" letter-spacing="0">Mint</text>
<text x="104" y="617" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#666666" text-anchor="start" letter-spacing="0">#39F79B</text>
<rect x="380" y="220" width="270" height="420" rx="28" fill="#000000"/>
<text x="404" y="585" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Black</text>
<text x="404" y="617" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="start" letter-spacing="0">#000000</text>
<rect x="680" y="220" width="270" height="420" rx="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="704" y="585" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#000000" text-anchor="start" letter-spacing="0">White</text>
<text x="704" y="617" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#666666" text-anchor="start" letter-spacing="0">#FFFFFF</text>
<rect x="980" y="220" width="270" height="420" rx="28" fill="#E8FFF0" stroke="#000000" stroke-width="2"/>
<text x="1004" y="585" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#000000" text-anchor="start" letter-spacing="0">Light Mint</text>
<text x="1004" y="617" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#666666" text-anchor="start" letter-spacing="0">#E8FFF0</text>
<rect x="1280" y="220" width="270" height="420" rx="28" fill="#F5F5F5" stroke="#000000" stroke-width="2"/>
<text x="1304" y="585" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#000000" text-anchor="start" letter-spacing="0">Neutral</text>
<text x="1304" y="617" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#666666" text-anchor="start" letter-spacing="0">#F5F5F5</text>
<text x="80" y="745" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#666666" text-anchor="start" letter-spacing="2">COLOR USAGE</text>
<text x="80" y="790" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#000000" text-anchor="start" letter-spacing="0">Base: White   ·   Structure: Black   ·   Accent / Promo: Mint</text>
<text x="80" y="835" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#666666" text-anchor="start" letter-spacing="0">Light Mint y Neutral funcionan como superficies de apoyo, no como protagonistas.</text>
</svg>